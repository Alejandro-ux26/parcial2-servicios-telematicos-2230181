# --- Configuración básica ---
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# --- Restringir usuarios a su home (jaula básica) ---
chroot_local_user=YES
allow_writeable_chroot=YES

# --- TLS / SSL (FTPS explícito) ---
ssl_enable=YES
rsa_cert_file=/etc/vsftpd/ssl/servidor.crt
rsa_private_key_file=/etc/vsftpd/ssl/servidor.key
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO

# Obligar cifrado en autenticación y en datos
force_local_logins_ssl=YES
force_local_data_ssl=YES

# --- Modo pasivo ---
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010
pasv_address=192.168.60.3

# --- Logging ---
xferlog_std_format=NO
log_ftp_protocol=YES
